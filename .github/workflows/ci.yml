name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Package standalone web build
        run: zip -r alazwak-web-build.zip dist
      - name: Upload standalone web build
        uses: actions/upload-artifact@v4
        with:
          name: alazwak-web-build
          path: alazwak-web-build.zip
          retention-days: 7
