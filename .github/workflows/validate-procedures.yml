name: Validate FSMS Procedures

on:
  pull_request:
    branches: [main]
    paths:
      - "public/horus-procedures/**"
      - "src/data/horus-procedures.json"
      - "scripts/validate-procedures.mjs"
      - ".github/workflows/validate-procedures.yml"
      - "package.json"
  workflow_dispatch:

jobs:
  validate:
    name: Validate procedure Word documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure unzip is available
        run: unzip -v >/dev/null

      - name: Validate procedures
        run: bun run validate:procedures
