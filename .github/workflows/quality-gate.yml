name: Application quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/database-tests/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/database-tests --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Changed-file lint (full lint debt remains tracked)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lint-changed.mjs
      - name: Frontend and handler regression tests
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile=reports/unit-tests.xml
      - name: PostgreSQL migration and RLS regression
        run: npm test --prefix tools/database-tests
      - name: Production build
        run: npm run build
      - name: Dependency inventory (existing findings are not waived)
        continue-on-error: true
        run: npm audit --json > reports/npm-audit.json
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
